<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F2EC">
  <title>Website on pause — BPE Cleaning</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Manrope; font-style: normal; font-weight: 200 800; font-display: swap; src: url('{{MANROPE}}') format('woff2'); }
    @font-face { font-family: Fraunces; font-style: normal; font-weight: 100 900; font-display: swap; src: url('{{FRAUNCES}}') format('woff2'); }
    @font-face { font-family: Fraunces; font-style: italic; font-weight: 100 900; font-display: swap; src: url('{{FRAUNCES_ITALIC}}') format('woff2'); }
    :root { color-scheme: light; --paper: #f5f2ec; --ink: #191512; --muted: #706859; --gold: #846439; --rule: #d8d0c2; --sans: Manrope, system-ui, sans-serif; --serif: Fraunces, Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.65 var(--sans); }
    ::selection { background: #e6dcc8; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
    .page { min-height: 100svh; display: flex; flex-direction: column; padding: 0 clamp(22px, 4.5vw, 72px); }
    .header { min-height: 112px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--rule); }
    .logo { width: 172px; height: auto; display: block; }
    .domain { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 760px; margin: auto; padding: 64px 0; text-align: center; }
    .eyebrow { font-size: 11px; font-weight: 600; line-height: 1.5; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; margin: 0 0 19px; }
    h1 { font: 400 clamp(45px, 5.7vw, 80px)/1.09 var(--serif); letter-spacing: -.045em; margin: 0; }
    h1 em { display: block; font-weight: 400; color: var(--gold); }
    .description { font-size: 15px; line-height: 1.9; color: var(--muted); margin: 24px auto 0; max-width: 460px; }
    .contact { width: 100%; max-width: 494px; margin: 36px auto 0; padding-top: 27px; border-top: 1px solid var(--rule); }
    .contact .eyebrow { color: var(--muted); font-size: 10px; letter-spacing: .18em; margin-bottom: 8px; }
    .contact-name { font-size: 19px; font-weight: 600; letter-spacing: -.03em; margin: 0; }
    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 23px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 10px; min-height: 54px; padding: 15px 21px; border: 1px solid var(--ink); font-size: 13px; font-weight: 600; transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease; }
    .button-primary { background: var(--ink); color: var(--paper); flex: 1; }
    .button-primary:hover { background: #3b3026; border-color: #3b3026; }
    .button-secondary { border-color: #b5aa98; flex: 1.2; white-space: nowrap; }
    .button-secondary:hover { background: #e9e2d7; border-color: var(--gold); }
    .button svg { width: 19px; height: 19px; flex-shrink: 0; }
    .footer { min-height: 88px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 24px; color: var(--muted); font-size: 12px; }
    .footer p { margin: 0; }
    .studio-link { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; transition: color 180ms ease; }
    .studio-link strong { color: var(--ink); font-weight: 600; }
    .studio-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    .studio-link svg { width: 16px; height: 16px; }
    @media (max-width: 600px) {
      .header { min-height: 86px; gap: 16px; }
      .logo { width: 138px; }
      .domain { font-size: 10px; letter-spacing: .05em; }
      main { padding: 48px 0 42px; }
      h1 { font-size: clamp(40px, 11.5vw, 64px); }
      .eyebrow { font-size: 10px; letter-spacing: .15em; }
      .description { font-size: 14px; margin-top: 20px; max-width: 305px; }
      .contact { margin-top: 29px; padding-top: 23px; }
      .actions { flex-direction: column; gap: 10px; margin-top: 20px; }
      .footer { justify-content: center; flex-direction: column; padding: 18px 0 14px; gap: 3px; text-align: center; font-size: 11px; }
    }
    @media (max-width: 350px) { .domain { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="logo" src="{{LOGO}}" alt="BPE Cleaning Services" width="172" height="52">
      <span class="domain">bpecleaning.ie</span>
    </header>
    <main>
      <p class="eyebrow">Temporarily unavailable</p>
      <h1>This website is <em>on pause.</em></h1>
      <p class="description">The website is temporarily unavailable.<br>Thank you for your understanding.</p>
      <section class="contact" aria-labelledby="contact-heading">
        <p class="eyebrow">Website administrator</p>
        <h2 class="contact-name" id="contact-heading">ArtioMotion</h2>
        <div class="actions">
          <a class="button button-primary" href="https://wa.me/37368189267" target="_blank" rel="noopener noreferrer" aria-label="Contact ArtioMotion on WhatsApp (opens a new tab)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/><path d="M8.6 7.8c.3 3.7 2 5.4 5.7 6.3l1.4-1.4-2-1-1 1a7.3 7.3 0 0 1-2.4-2.4l1-1-1.1-2z"/></svg>
            WhatsApp
          </a>
          <a class="button button-secondary" href="tel:+37368189267" aria-label="Call ArtioMotion at +373 681 89 267">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>
            +373 681 89 267
          </a>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>BPE Cleaning Services <span aria-hidden="true">·</span> Dublin, Ireland</p>
      <a class="studio-link" href="https://artiomotion.com" target="_blank" rel="noopener noreferrer" aria-label="Visit ArtioMotion (opens a new tab)">
        <span>Website by <strong>ArtioMotion</strong></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
    </footer>
  </div>
</body>
</html>
